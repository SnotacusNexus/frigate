name: Build TensorRT Image

on:
  push:
    branches:
      - ptz-dynamic-masks-v0.16.4
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: snotacusnexus/frigate

jobs:
  build-tensorrt:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate version.py
        run: echo 'VERSION = "0.16.4-ptz-dynamic"' > frigate/version.py

      - name: Set up QEMU and Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build and push TensorRT (AMD64)
        env:
          COMPUTE_LEVEL: "50 60 70 80 90"
        uses: docker/bake-action@v6
        with:
          source: .
          push: true
          targets: tensorrt
          files: docker/tensorrt/trt.hcl
          set: |
            tensorrt.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:0.16.4-tensorrt
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max

      - name: Monitor build progress
        run: echo "Build completed successfully"
